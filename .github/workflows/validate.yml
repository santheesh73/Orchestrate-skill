name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill structure
        run: python tools/validate_skill.py
      - name: Test bundled scripts
        run: python -m unittest discover -s tests -v
      - name: Scripts show help
        run: for s in hackerrank-orchestrate/scripts/*.py; do python "$s" --help > /dev/null; done
