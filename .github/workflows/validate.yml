name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill structure and content
        run: python tools/validate_skill.py
      - name: Tests (warnings are errors)
        run: python -W error -m unittest discover -s tests -v
      - name: Trigger evals, offline proxy only (never --live in CI)
        run: python tools/run_trigger_evals.py --offline --min-precision 0.6 --min-recall 0.5
      - name: Installed packages, selfchecks, CLI help and footprint
        run: python tools/ci_check.py
