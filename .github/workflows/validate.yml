name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill structure and content
        run: python tools/validate_skill.py
      - name: Static checks and universal skill validation
        run: |
          python tools/static_check.py
          python -m orchestrate_toolkit validate
      - name: Tests (warnings are errors)
        run: python -W error -m unittest discover -s tests -v
      - name: Audit controls and synthetic benchmark evidence
        run: |
          python -m orchestrate_toolkit audit-selftest
          python benchmarks/comparison/run.py --own-leakage-audit decision_ids --report comparison-ci.json
      - name: Behavior grader controls (offline, no agent invocation)
        run: python tools/evaluate_behavior.py selftest --suite evals/behavior
      - name: Trigger evals, offline proxy only (never --live in CI)
        run: python tools/run_trigger_evals.py --offline --min-precision 0.6 --min-recall 0.5
      - name: Installed packages, selfchecks, CLI help and footprint
        run: python tools/ci_check.py
      - name: Wheel build dependencies
        run: python -m pip install "setuptools>=68,<81" wheel
      - name: Wheel installs and runs outside the checkout
        run: python tools/wheel_smoke.py
